name: Đề xuất tính năng
description: Đề xuất thay đổi hoặc tính năng mới
labels: [enhancement]
body:
  - type: dropdown
    id: flow
    attributes:
      label: Luồng liên quan
      description: Đề xuất này phục vụ luồng nào của Holocron?
      options:
        - Nhập tài liệu môn học (Knowledge Vault)
        - Nhập đề (Ingestion Gate)
        - Sinh câu hỏi (Deterministic Core)
        - Chấm câu trả lời
        - Hạ tầng (CI, công cụ, cấu hình, phát hành)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề cần giải quyết
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Đề xuất
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Tác động tới bất biến I1–I5 và contract
      description: Có đổi model Pydantic, `types/holocron.ts` hoặc SPECIFICATION.md không?
    validations:
      required: true
