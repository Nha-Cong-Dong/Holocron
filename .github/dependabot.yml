version: 2
updates:
  - package-ecosystem: pip
    directory: /holocron/backend
    target-branch: "develop"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /holocron/frontend
    target-branch: "develop"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    target-branch: "develop"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
