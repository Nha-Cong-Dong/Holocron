name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: holocron/backend/pyproject.toml
      - name: Version khớp tag
        run: python scripts/check_versions.py "$GITHUB_REF_NAME"
      - name: Bản ổn định chỉ được tag trên commit thuộc main
        if: ${{ !contains(github.ref_name, '-') }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Cài đặt
        working-directory: holocron/backend
        run: python -m pip install -e ".[dev]"
      - name: pytest
        working-directory: holocron/backend
        run: python -m pytest -q
      - name: Đo ngưỡng phát hành
        run: python scripts/release_bench.py --json bench.json
      - name: Release notes từ CHANGELOG
        run: python scripts/extract_release_notes.py "$GITHUB_REF_NAME" > release_notes.md
      - name: Tạo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release_notes.md $PRERELEASE bench.json
