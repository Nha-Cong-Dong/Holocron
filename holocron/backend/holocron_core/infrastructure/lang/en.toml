# Mẫu phụ thuộc tiếng Anh cho bộ dựng khối (ADR-010 mục 12, 16; ADR-006 mục 10).
# Bộ nạp (`infrastructure/lang_patterns.py`) nạp HỢP mọi tệp ngôn ngữ, không đoán ngôn ngữ tài liệu.
# Sửa tệp này làm đổi `layout_settings_sha256` (ADR-010 mục 15): phải tăng `LAYOUT_VERSION` cùng PR.

# Mẫu số trang có chữ: so khớp không phân biệt hoa thường trên chữ đã NFC + gộp khoảng trắng; nhóm `n` là số trang.
page_number_patterns = [
    '^page\s+(?P<n>\d{1,5})$',
    '^page\s+(?P<n>\d{1,5})\s+of\s+\d{1,5}$',
    '^p\.\s*(?P<n>\d{1,5})$',
]

# Hậu tố nối trang của tiêu đề (X08).
continuation_suffixes = ["(cont.)", "(cont'd)", "(continued)"]

# Từ khoá tiêu đề (X09 chuyển từ `vault_chunking.HEADING_RE`, ADR-010 mục 16).
heading_keywords = ["chapter", "part", "section", "lecture", "unit"]
