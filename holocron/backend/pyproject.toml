[project]
name = "holocron-core"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["holocron_core*"]

[tool.setuptools.package-data]
holocron_core = ["templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
