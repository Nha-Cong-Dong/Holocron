[project]
name = "holocron-core"
version = "0.1.0a0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "fastapi>=0.161.1",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pypdfium2==5.14.0",
    "rapidocr==3.10.0",
    "onnxruntime==1.31.0",
    "opencv-python-headless==5.0.0.93",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "httpx>=0.27", "ruff>=0.17.2", "mypy>=2.4.0", "pytest-cov>=7.1.0"]

[tool.setuptools.packages.find]
include = ["holocron_core*"]

[tool.setuptools.package-data]
holocron_core = ["infrastructure/templates/*.py", "infrastructure/storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.coverage.run]
branch = true
source = ["holocron_core"]
# Hai nơi chỉ chạy trong tiến trình con của sandbox (`python -S`, môi trường rỗng) nên coverage không đo được;
# hành vi của chúng được kiểm bởi tests/test_sandbox_security.py, test_sandbox_limits.py và test_rr_template.py.
omit = ["holocron_core/sandbox/_sandbox_child.py", "holocron_core/infrastructure/templates/*"]

[tool.coverage.report]
fail_under = 94
show_missing = true
