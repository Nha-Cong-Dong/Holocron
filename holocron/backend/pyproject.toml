[project]
name = "holocron-core"
version = "0.1.0a0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.32"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["holocron_core*"]

[tool.setuptools.package-data]
holocron_core = ["infrastructure/templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.coverage.run]
branch = true
source = ["holocron_core"]
# Hai nơi chỉ chạy trong tiến trình con của sandbox (`python -S`, môi trường rỗng) nên coverage không đo được;
# hành vi của chúng được kiểm bởi tests/test_sandbox_security.py, test_sandbox_limits.py và test_rr_template.py.
omit = ["holocron_core/sandbox/_sandbox_child.py", "holocron_core/infrastructure/templates/*"]

[tool.coverage.report]
fail_under = 94
show_missing = true
