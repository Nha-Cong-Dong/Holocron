<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holocron</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #222; --muted: #666; --error: #a3261c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151515; --fg: #eee; --muted: #aaa; --error: #ff8a80; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font-family: system-ui, "Segoe UI", sans-serif;
  }
  main { max-width: 36rem; padding: 1.5rem; text-align: center; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }
  p { margin: 0.25rem 0; color: var(--muted); line-height: 1.5; }
  main[data-state="error"] h1 { color: var(--error); }
</style>
</head>
<body>
<main id="status" data-state="loading" aria-live="polite">
  <h1 id="title">Đang khởi động Holocron…</h1>
  <p id="detail">Lần mở đầu tiên có thể mất vài giây.</p>
</main>
</body>
</html>
